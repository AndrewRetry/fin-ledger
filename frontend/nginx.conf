# Serves the built console and forwards /api/... to the backend without the /api prefix
# (the trailing slash in proxy_pass strips it), so the browser only ever talks to one origin.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://app:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Client-side routes (/accounts/..., /transactions/...) all load the same page.
  location / {
    try_files $uri /index.html;
  }
}
